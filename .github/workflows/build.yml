name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: /usr/local/share/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/linux-debug/vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build build/linux-debug

  build-windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/windows-debug/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-

      - name: Configure
        run: cmake --preset windows-debug
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Build
        run: cmake --build build/windows-debug --config Debug
        env:
          VCPKG_ROOT: C:\vcpkg
