name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-tool-linux-${{ runner.os }}

      - name: Setup vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/linux-debug/vcpkg_installed
          key: vcpkg-packages-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-packages-linux-

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build build/linux-debug

  build-windows:
    name: Windows Build
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg tool
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg
          key: vcpkg-tool-windows-${{ runner.os }}

      - name: Setup vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          git fetch --unshallow --tags
          .\bootstrap-vcpkg.bat
        shell: cmd

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/windows-debug/vcpkg_installed
          key: vcpkg-packages-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-packages-windows-

      - name: Configure
        run: cmake --preset windows-debug

      - name: Build
        run: cmake --build build/windows-debug
